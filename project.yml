name: NX2AppleSigner

options:
  bundleIdPrefix: com.pdjwin
  deploymentTarget:
    iOS: "15.0"

packages:
  RorkSign:
    url: https://github.com/rorkai/rork-sign.git
    from: 0.6.5

targets:
  NX2AppleSigner:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources

    dependencies:
      - package: RorkSign
        product: RorkSign

    info:
      properties:
        CFBundleDisplayName: NX2Apple Signer
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdjwin.nx2applesigner
        PRODUCT_NAME: NX2AppleSigner

        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        GENERATE_INFOPLIST_FILE: YES

        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

        IPHONEOS_DEPLOYMENT_TARGET: "15.0"

        CODE_SIGNING_ALLOWED: NO
