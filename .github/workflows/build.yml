name: NX2Apple Signer Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: nx2apple-signer-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA

    runs-on: xcode-27

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project NX2AppleSigner.xcodeproj \
            -scheme NX2AppleSigner

      - name: Build iOS application
        run: |
          set -o pipefail

          xcodebuild \
            -project NX2AppleSigner.xcodeproj \
            -scheme NX2AppleSigner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build | tee build.log

      - name: Verify application
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NX2AppleSigner.app"
          PLIST="$APP_PATH/Info.plist"

          echo "Checking application..."

          test -d "$APP_PATH"
          test -f "$PLIST"

          echo "Checking Files integration..."

          FILE_SHARING=$(/usr/libexec/PlistBuddy \
            -c "Print :UIFileSharingEnabled" "$PLIST")

          OPEN_IN_PLACE=$(/usr/libexec/PlistBuddy \
            -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST")

          echo "UIFileSharingEnabled: $FILE_SHARING"
          echo "LSSupportsOpeningDocumentsInPlace: $OPEN_IN_PLACE"

          if [ "$FILE_SHARING" != "true" ]; then
            echo "ERROR: UIFileSharingEnabled is not true."
            exit 1
          fi

          if [ "$OPEN_IN_PLACE" != "true" ]; then
            echo "ERROR: LSSupportsOpeningDocumentsInPlace is not true."
            exit 1
          fi

          echo "Files integration verification successful."

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NX2AppleSigner.app"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/NX2AppleSigner.app

          zip -r -X NX2AppleSigner-unsigned.ipa Payload

          unzip -Z1 NX2AppleSigner-unsigned.ipa \
            | grep -q '^Payload/NX2AppleSigner.app/Info.plist$'

          echo "IPA packaging successful."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX2AppleSigner-unsigned-IPA
          path: NX2AppleSigner-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NX2AppleSigner-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
