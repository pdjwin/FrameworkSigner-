name: NX2Apple Signer Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project NX2AppleSigner.xcodeproj \
            -scheme NX2AppleSigner

      - name: Build iOS application
        run: |
          set -o pipefail

          xcodebuild \
            -project NX2AppleSigner.xcodeproj \
            -scheme NX2AppleSigner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build | tee build.log

      - name: Verify application
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NX2AppleSigner.app"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          echo "Application build verified."

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NX2AppleSigner.app"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/NX2AppleSigner.app

          zip -r -X NX2AppleSigner-unsigned.ipa Payload

          unzip -Z1 NX2AppleSigner-unsigned.ipa \
            | grep -q '^Payload/NX2AppleSigner.app/Info.plist$'

          echo "IPA packaging verified."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX2AppleSigner-unsigned-IPA
          path: NX2AppleSigner-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NX2AppleSigner-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
